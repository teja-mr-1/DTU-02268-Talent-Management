plugins {
    id 'application'
}

group = 'dk.dtu'
version = '1.0.0'
repositories { mavenCentral() }

dependencies {
    implementation 'org.apache.flink:flink-streaming-java:2.3.0'
    implementation 'org.apache.flink:flink-clients:2.3.0'
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'org.apache.flink:flink-streaming-java:2.3.0:tests'
    testImplementation 'org.apache.flink:flink-runtime:2.3.0:tests'
    testImplementation 'org.apache.flink:flink-test-utils:2.3.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Werror']
}
test { useJUnitPlatform() }
application { mainClass = 'dk.dtu.applications.TalentApplication' }
processResources { from('../application-form') { into 'static' } }

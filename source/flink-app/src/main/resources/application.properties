server.port=${HTTP_PORT:8090}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.main.banner-mode=off

# Keep business events visible without the embedded runtime's verbose INFO output.
logging.level.dk.dtu.applications=${APP_LOG_LEVEL:INFO}
logging.level.org.apache.flink=${FLINK_LOG_LEVEL:WARN}
logging.level.org.apache.pekko=WARN

# Shared timeouts for the worker and sink Camunda clients.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s
